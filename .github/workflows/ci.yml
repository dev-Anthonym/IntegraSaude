name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Rodar testes
        run: mvn -B test

      - name: Guardar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  validar-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Executar script do banco em SQLite vazio
        run: |
          if [ -f "database/entrega/lembretes_completo.sql" ]; then
            sudo apt-get update && sudo apt-get install -y sqlite3
            sqlite3 :memory: ".bail on" ".read database/entrega/lembretes_completo.sql"
          else
            echo "Aguardando criacao do script unico na Etapa 9."
          fi
