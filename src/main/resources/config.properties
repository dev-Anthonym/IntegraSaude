# Tempo (em minutos) para um lembrete pendente virar PERDIDO (RN10)
lembrete.tempo-limite-minutos=30
# Antecedencia (em minutos) do lembrete de consulta
lembrete.antecedencia-consulta-minutos=60
# Intervalo (em segundos) entre verificacoes do agendador
agendador.intervalo-segundos=30
# Arquivo do banco SQLite (a pasta e criada automaticamente se nao existir)
banco.caminho=database/integrasaude.db
